name: Deploy CA Final Revision Vault to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build static site
        env:
          VITE_GOOGLE_DRIVE_API_KEY: ${{ secrets.VITE_GOOGLE_DRIVE_API_KEY }}
          VITE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.VITE_DRIVE_ROOT_FOLDER_ID }}
          VITE_DRIVE_FOLDER_FR: ${{ secrets.VITE_DRIVE_FOLDER_FR }}
          VITE_DRIVE_FOLDER_AUDIT: ${{ secrets.VITE_DRIVE_FOLDER_AUDIT }}
          VITE_DRIVE_FOLDER_AFM: ${{ secrets.VITE_DRIVE_FOLDER_AFM }}
          VITE_DRIVE_FOLDER_IDT: ${{ secrets.VITE_DRIVE_FOLDER_IDT }}
          VITE_DRIVE_FOLDER_DT: ${{ secrets.VITE_DRIVE_FOLDER_DT }}
          VITE_FEEDBACK_SCRIPT_URL: ${{ secrets.VITE_FEEDBACK_SCRIPT_URL }}
          VITE_DESCRIPTIVE_UPLOAD_SCRIPT_URL: ${{ secrets.VITE_DESCRIPTIVE_UPLOAD_SCRIPT_URL }}
        run: |
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
